name: Build Rust Libraries

on:
  push:
    paths:
      - 'rust/**'
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Android (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build
        run: cd rust && cargo ndk -t ${{ matrix.abi }} build --release
      - uses: actions/upload-artifact@v4
        with:
          name: librust-${{ matrix.abi }}
          path: rust/target/${{ matrix.target }}/release/librust.so
          retention-days: 30

  build-ios:
    name: iOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-ios
            name: device
          - target: aarch64-apple-ios-sim
            name: simulator-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}
      - name: Build
        run: cd rust && cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: librust-${{ matrix.name }}
          path: rust/target/${{ matrix.target }}/release/librust.a
          retention-days: 30
