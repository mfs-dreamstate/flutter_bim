name: flutter_bim_example
description: Example app demonstrating flutter_bim package usage
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Use the parent package
  flutter_bim:
    path: ../

  # Required for iOS static library loading
  flutter_rust_bridge: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/test/sample_building.ifc
    - assets/test/sample_structural.ifc
    - assets/test/sample_mep.ifc
    - assets/test/sample_electrical.ifc
    # NordicLCA project - Structural + Electrical layers
    - assets/nordic/STRUC_NordicLCA_Housing_Concrete_BuildingPermit.ifc
    - assets/nordic/STRUC_NordicLCA_Housing_Timber_BuildingPermit.ifc
    - assets/nordic/STRUC_NordicLCA_Office_Concrete_BuildingPermit.ifc
    - assets/nordic/STRUC_NordicLCA_Office_Timber_BuildingPermit.ifc
    - assets/nordic/ELE_NordicLCA_Housing_Concrete_BuildingPermit.ifc
    - assets/nordic/ELE_NordicLCA_Housing_Timber_BuildingPermit.ifc
    - assets/nordic/ELE_NordicLCA_Office_Concrete_BuildingPermit.ifc
    - assets/nordic/ELE_NordicLCA_Office_Timber_BuildingPermit.ifc
