[package]
name = "rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Flutter Rust Bridge
flutter_rust_bridge = "=2.11.1"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Graphics (Phase 3)
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }

# Math
nalgebra = "0.32"
glam = "0.25"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# File parsing (for IFC - Phase 2)
nom = "7.1"

# Image export (Phase 8)
image = "0.24"

# BCF collaboration support (Phase 5)
quick-xml = "0.36"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
uuid = { version = "1.10", features = ["v4"] }

# Parallel computation (Phase 8)
rayon = "1.10"

# Point cloud support (Phase 6)
las = "0.8"

# Memory-mapped files (Phase 6)
memmap2 = "0.9"

# Spatial indexing (Phase 2)
# rstar = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true          # Strip debug symbols for smaller binary
panic = "abort"       # Smaller binary size (no unwinding)

[profile.dev]
opt-level = 0

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "tessellation"
harness = false
